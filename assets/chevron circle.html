<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Export</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh;
        background: #f5f5f5;
      }
      .container { 
        max-width: 100%; 
        padding: 20px;
      }
      svg, img { 
        display: block; 
        max-width: 100%;
        height: auto;
      }
    </style>
</head>
<body>
  <div class="container">
    <svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <line x1="300" y1="300" x2="400" y2="200" stroke="#000000" stroke-width="6"/>
  <circle cx="513.133" cy="154.837" r="130.427" fill="none" stroke="#000000" stroke-width="6" transform="matrix(1, 0, 0, 1, -112.280701754386, 111.442786069652)"/>
  <line x1="400" y1="200" x2="500" y2="300" stroke="#000000" stroke-width="6"/>
</svg>
  </div>
</body>
</html>
