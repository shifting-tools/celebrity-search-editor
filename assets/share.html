<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Export</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh;
        background: #f5f5f5;
      }
      .container { 
        max-width: 100%; 
        padding: 20px;
      }
      svg, img { 
        display: block; 
        max-width: 100%;
        height: auto;
      }
    </style>
</head>
<body>
  <div class="container">
    <svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <circle cx="500" cy="200" r="0" fill="#000000" stroke="#000000" stroke-width="2"/>
  <circle cx="500" cy="200" r="0" fill="#000000" stroke="#000000" stroke-width="2"/>
  <circle cx="500" cy="200" r="0" fill="#000000" stroke="#000000" stroke-width="2"/>
  <circle cx="500" cy="200" r="48.134" fill="#000000" stroke="#000000" stroke-width="2" transform="matrix(1, 0, 0, 1, 0, -100)"/>
  <circle cx="499.712" cy="242.852" r="48.134" fill="#000000" stroke="#000000" stroke-width="2" transform="matrix(1, 0, 0, 1, 0.288033516627, 257.148468185389)"/>
  <circle cx="488.819" cy="255.42" r="48.134" fill="#000000" stroke="#000000" stroke-width="2" transform="matrix(1, 0, 0, 1, -288.819062581828, 40.848192879089)"/>
  <line x1="500" y1="100" x2="200" y2="300" stroke="#000000" stroke-width="14"/>
  <line x1="200" y1="300" x2="500" y2="500" stroke="#000000" stroke-width="14"/>
</svg>
  </div>
</body>
</html>
