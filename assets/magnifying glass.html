<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Export</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh;
        background: #f5f5f5;
      }
      .container { 
        max-width: 100%; 
        padding: 20px;
      }
      svg, img { 
        display: block; 
        max-width: 100%;
        height: auto;
      }
    </style>
</head>
<body>
  <div class="container">
    <svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <circle cx="200" cy="200" r="100" fill="none" stroke="#000000" stroke-width="12"/>
  <line x1="273.49" y1="270.469" x2="442.748" y2="449.783" stroke="#000000" stroke-width="12"/>
</svg>
  </div>
</body>
</html>
