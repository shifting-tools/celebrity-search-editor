<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post Editor</title>
    <link rel="stylesheet" href="insta-post.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="links">
            <a href="../../index.html" class="website-link">Singer Google search</a>
            <a href="../actor/actor.html" class="website-link">Actor Google search</a>
            <a href="../insta-profile/instaprofile.html" class="website-link">Instagram Profile</a>
            <a href="../tiktok-profile/tiktokprofile.html" class="website-link">TikTok Profile</a>
        </div>
        <div class="app-container">
            <header class="app-header">
                <h1>Instagram Post Editor</h1>
                <div class="toolbar">
                    <button id="undoBtn" class="btn" title="Undo (Ctrl+Z)">↶ Undo</button>
                    <button id="redoBtn" class="btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
                    <button id="exportPngBtn" class="btn btn-primary" title="Exporting may take a moment">Export PNG</button>
                    <button id="resetBtn" class="btn btn-danger" title="Reset Template">Reset Template</button>
                    <button id="exportProjectBtn" class="btn">Export Project</button>
                    <button id="importProjectBtn" class="btn">Import Project</button>
                </div>
            </header>

            <div class="main-content">
                <div class="variables-panel">
                    <h3>Variables</h3>
                    <div class="variables-form">
                        <div class="form-group">
                            <label for="var-username">Username</label>
                            <input type="text" id="var-username" data-variable="username">
                        </div>
                        <div class="form-group">
                            <label for="var-caption">Caption</label>
                            <textarea id="var-caption" data-variable="caption"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="var-likes">Likes</label>
                            <input type="text" id="var-likes" data-variable="likes">
                        </div>
                        <div class="form-group">
                            <label for="var-comments">Comments</label>
                            <input type="text" id="var-comments" data-variable="comments">
                        </div>
                        <div class="form-group">
                            <label for="var-date">Date</label>
                            <input type="text" id="var-date" data-variable="date">
                        </div>
                    </div>
                </div>

                <div id="previewCanvas" class="preview-canvas">
                    <div class="insta-post">
                        <div class="post-header">
                            <div class="post-avatar-wrapper">
                                <img id="postAvatar" class="post-avatar" src="" alt="Avatar" data-image-slot="postAvatar">
                                <div class="image-placeholder avatar-placeholder">+</div>
                            </div>
                            <div class="post-username" data-variable="username">{username}</div>
                            <div class="post-options">•••</div>
                        </div>
                        <div class="post-image-wrapper">
                            <img id="postImage" class="post-image" src="" alt="Post" data-image-slot="postImage">
                            <div class="image-placeholder post-image-placeholder">Click to add image</div>
                        </div>
                        <div class="post-actions">
                            <div class="action-icons">
                                <svg class="action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                                <svg class="action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                                </svg>
                                <svg class="action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </div>
                            <div class="action-icon bookmark">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="post-stats">
                            <span class="likes-count" data-variable="likes">{likes} likes</span>
                        </div>
                        <div class="post-caption">
                            <span class="caption-username" data-variable="username">{username}</span>
                            <span class="caption-text" data-variable="caption">{caption}</span>
                        </div>
                        <div class="post-meta">
                            <span class="comments-count" data-variable="comments">View all {comments} comments</span>
                            <span class="post-date" data-variable="date">{date}</span>
                        </div>
                    </div>
                </div>

                <div class="image-library-panel">
                    <h3>Image Library</h3>
                    <div class="library-header-buttons">
                        <button id="addImageBtn" class="btn btn-primary btn-small">Add Image</button>
                        <button id="refreshLibraryBtn" class="btn btn-small">Refresh</button>
                    </div>
                    <div id="imageLibrary" class="image-library-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" multiple style="display: none;">
    <input type="file" id="projectImportInput" accept=".json" style="display: none;">

    <script src="insta-post.js"></script>
</body>
</html>
